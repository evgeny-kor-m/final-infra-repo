# Resource budget for monitoring namespace (Elasticsearch, Logstash, Kibana, Filebeat, Metricbeat, APM Server)
# Heaviest namespace in the cluster - Elasticsearch and Logstash run on JVM
apiVersion: v1
kind: ResourceQuota
metadata:
  name: monitoring-quota
  namespace: monitoring
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: "1.7Gi"
    limits.cpu: "1"
    limits.memory: "2.3Gi"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: monitoring-limits
  namespace: monitoring
spec:
  limits:
  - default:
      cpu: "100m"
      memory: "250Mi"
    defaultRequest:
      cpu: "50m"
      memory: "130Mi"
    type: Container
