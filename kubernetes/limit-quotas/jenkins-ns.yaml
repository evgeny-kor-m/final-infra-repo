# Resource budget for Jenkins namespace (Jenkins controller + dynamic CI build agents)
# Controller resources kept minimal since it's mostly idle; agent gets headroom for npm build
apiVersion: v1
kind: ResourceQuota
metadata:
  name: jenkins-ns-quota
  namespace: jenkins-ns
spec:
  hard:
    requests.cpu: "700m"
    requests.memory: "1.4Gi"   # controller ~400Mi + build agent ~768Mi + buffer
    limits.cpu: "1.5"
    limits.memory: "2.2Gi"     # controller ~700Mi + build agent ~1.5Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: jenkins-ns-limits
  namespace: jenkins-ns
spec:
  limits:
  - default:
      cpu: "300m"
      memory: "700Mi"
    defaultRequest:
      cpu: "100m"
      memory: "400Mi"
    type: Container