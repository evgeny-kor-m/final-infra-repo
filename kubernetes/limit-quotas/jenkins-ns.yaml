# Resource budget for Jenkins namespace (Jenkins controller + dynamic CI build agents)
apiVersion: v1
kind: ResourceQuota
metadata:
  name: jenkins-ns-quota
  namespace: jenkins-ns
spec:
  hard:
    requests.cpu: "700m"
    requests.memory: "1.4Gi"
    limits.cpu: "1.5"
    limits.memory: "2.4Gi"   # bumped slightly: 768Mi (controller) + 1536Mi (agent) + small buffer
---
apiVersion: v1
kind: LimitRange
metadata:
  name: jenkins-ns-limits
  namespace: jenkins-ns
spec:
  limits:
  - default:
      cpu: "300m"
      memory: "700Mi"
    defaultRequest:
      cpu: "100m"
      memory: "400Mi"
    type: Container