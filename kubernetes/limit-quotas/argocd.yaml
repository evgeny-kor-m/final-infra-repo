# Resource budget for ArgoCD namespace
# Components: argocd-server, repo-server, application-controller, dex-server,
# redis, applicationset-controller, notifications-controller (7 pods total)
apiVersion: v1
kind: ResourceQuota
metadata:
  name: argocd-quota
  namespace: argocd
spec:
  hard:
    requests.cpu: "700m"
    requests.memory: "900Mi"
    limits.cpu: "1.5"          # bumped from 1 - 7 pods at 150m default exceed previous limit
    limits.memory: "1.4Gi"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: argocd-limits
  namespace: argocd
spec:
  limits:
  - default:
      cpu: "150m"
      memory: "200Mi"
    defaultRequest:
      cpu: "60m"
      memory: "100Mi"
    type: Container