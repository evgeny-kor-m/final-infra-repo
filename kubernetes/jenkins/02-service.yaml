apiVersion: v1
kind: Service
metadata:
  name: jenkins-service
  namespace: jenkins-ns
  annotations:
      prometheus.io/scrape: 'true'
      prometheus.io/path:   /
      prometheus.io/port:   '8080'
spec:
  selector: 
    app: jenkins-srv
  type: NodePort  
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30003
    - name: jnlp
      port: 50000
      targetPort: 50000