kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
# Control plane node - API server, scheduler, controller
- role: control-plane
  image: kindest/node:v1.31.0
  extraPortMappings:
  - containerPort: 30000      # port inside the kind container (Node port)
    hostPort: 30000           # port on your local machine (WSL/Windows)
    listenAddress: "0.0.0.0"  # listen on all interfaces

- role: worker
  image: kindest/node:v1.31.0
  extraPortMappings:
  - containerPort: 30001      # NodePort of the Service inside the cluster
    hostPort: 30001           # access from browser: http://localhost:30001
    listenAddress: "0.0.0.0"
  - containerPort: 30002      # NodePort of the second Service inside the cluster
    hostPort: 30002           # access from browser: http://localhost:30002
    listenAddress: "0.0.0.0"

- role: worker
  image: kindest/node:v1.31.0
  extraPortMappings:
  - containerPort: 30003      # NodePort of the Service inside the cluster
    hostPort: 30003           # access from browser: http://localhost:30003
    listenAddress: "0.0.0.0"
  - containerPort: 30004      # NodePort of the second Service inside the cluster
    hostPort: 30004           # access from browser: http://localhost:30004
    listenAddress: "0.0.0.0"
# Allow pulling images from insecure Nexus registry inside the cluster
containerdConfigPatches:
- |-
  [plugins."io.containerd.grpc.v1.cri".registry.configs."nexus-service.nexus-ns.svc.cluster.local:8083".tls]
    insecure_skip_verify = true
  [plugins."io.containerd.grpc.v1.cri".registry.mirrors."nexus-service.nexus-ns.svc.cluster.local:8083"]
    endpoint = ["http://nexus-service.nexus-ns.svc.cluster.local:8083"]