apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-app
  namespace: backend
  labels:
    app: backend-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-app
  template:
    metadata:
      labels:
        app: backend-app
    spec:
      imagePullSecrets:
      - name: nexus-registry-secret
      containers:
      - name: backend-container
        image: nexus-service.nexus-ns.svc.cluster.local:8083/backend-image:21e44fc4de34f86651c719239826a1a89d9f638f
        imagePullPolicy: Always # Always pull # IfNotPresent # use local image if exists, skip pulling
        ports:
        - containerPort: 5000

        env:
        # From Secret
        - name: DB_ReadWrite_User                   # 
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: DB_ReadWrite_User
        - name: DB_ReadWrite_Pass                   # 
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: DB_ReadWrite_Pass   
        - name: DB_ReadOnly_User                   # 
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: DB_ReadOnly_User
        - name: DB_ReadOnly__Pass                   # 
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: DB_ReadOnly__Pass  
      
        # From ConfigMap    
        - name: DB_CONNECT_STR
          valueFrom:
            configMapKeyRef:
              name: backend-cm
              key: DB_CONNECT_STR 
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: backend-cm
              key: DB_HOST
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: backend-cm
              key: DB_NAME
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: backend-cm
              key: DB_PORT                                    

        envFrom:
        # All keys from app-config become environment variables
        - configMapRef:
            name: backend-cm