namespaceOverride: "monitoring"

apmConfig:
  apm-server.yml: |
    apm-server:
      host: "0.0.0.0:8200"  # Listen on all interfaces

    output.elasticsearch:
      hosts: ["https://elasticsearch-master:9200"]
      username: '${ELASTICSEARCH_USERNAME}'
      password: '${ELASTICSEARCH_PASSWORD}'
      ssl.certificate_authorities:
        - /usr/share/apm-server/config/elasticsearch-master-certs/ca.crt

extraEnvs:
  - name: ELASTICSEARCH_USERNAME
    valueFrom:
      secretKeyRef:
        name: elasticsearch-master-credentials
        key: username
  - name: ELASTICSEARCH_PASSWORD
    valueFrom:
      secretKeyRef:
        name: elasticsearch-master-credentials
        key: password

secretMounts:
  - name: elasticsearch-master-certs
    secretName: elasticsearch-master-certs
    path: /usr/share/apm-server/config/elasticsearch-master-certs

service:
  type: ClusterIP
  port: 8200  # APM agents connect to this port

resources:
  requests:
    cpu: "100m"
    memory: "100Mi"
  limits:
    cpu: "200m"
    memory: "256Mi"